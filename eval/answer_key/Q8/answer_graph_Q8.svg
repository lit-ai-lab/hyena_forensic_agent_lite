<text x="78" y="325" font-size="11.5" fill="#171C23">Refusal to cover work during leave</text>
<rect x="400" y="102" width="280" height="48" rx="7" fill="var(--cl-bg,#E5ECF8)" stroke="var(--cl,#2B549C)" stroke-width="1.5"/>
<text x="412" y="121" font-family="monospace" font-size="10" font-weight="600" fill="var(--cl,#2B549C)">C1</text>
<text x="444" y="121" font-size="11.5" fill="#171C23">She used her position of superiority</text>
<text x="444" y="136" font-size="9.5" fill="#6B7887">Element 1</text>
<rect x="400" y="170" width="280" height="48" rx="7" fill="var(--cl-bg,#E5ECF8)" stroke="var(--cl,#2B549C)" stroke-width="1.5"/>
<text x="412" y="189" font-family="monospace" font-size="10" font-weight="600" fill="var(--cl,#2B549C)">C2</text>
<text x="444" y="189" font-size="11.5" fill="#171C23">Exceeded the reasonable scope of work</text>
<text x="444" y="204" font-size="9.5" fill="#6B7887">Element 2</text>
<rect x="400" y="238" width="280" height="48" rx="7" fill="var(--cl-bg,#E5ECF8)" stroke="var(--cl,#2B549C)" stroke-width="1.5"/>
<text x="412" y="257" font-family="monospace" font-size="10" font-weight="600" fill="var(--cl,#2B549C)">C3</text>
<text x="444" y="257" font-size="11.5" fill="#171C23">Caused distress and soured the workplace</text>
<text x="444" y="272" font-size="9.5" fill="#6B7887">Element 3</text>
<rect x="766" y="125" width="208" height="139" rx="9" fill="var(--ans-bg,#F8E6ED)" stroke="var(--ans,#9E2B58)" stroke-width="1.8"/>
<text x="870" y="145" text-anchor="middle" font-family="monospace" font-size="9.5" fill="var(--ans,#9E2B58)">Conclusion A</text>
<text x="870" y="167" text-anchor="middle" font-size="11.5" fill="#171C23">Assistant Manager Kang Su-min's</text>
<text x="870" y="185" text-anchor="middle" font-size="11.5" fill="#171C23">conduct meets all three elements</text>
<text x="870" y="203" text-anchor="middle" font-size="11.5" fill="#171C23">of workplace harassment</text>
<line x1="780" y1="215" x2="960" y2="215" stroke="var(--ans,#9E2B58)" stroke-width="1" opacity=".3"/>
<text x="870" y="231" text-anchor="middle" font-size="9.5" fill="#6B7887">Full credit requires supporting each</text>
<text x="870" y="244" text-anchor="middle" font-size="9.5" fill="#6B7887">of the three elements and tying</text>
<text x="870" y="257" text-anchor="middle" font-size="9.5" fill="#6B7887">them together</text>
