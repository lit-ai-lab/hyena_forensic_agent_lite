<text x="78" y="257" font-size="11.5" fill="#171C23">Work dumped on Go Su-bong</text>
<text x="78" y="269" font-size="9.5" fill="#6B7887">A task the team leader gave her was passed</text>
<text x="78" y="280" font-size="9.5" fill="#6B7887">on to him without a separate report</text>
<rect x="34" y="306" width="280" height="48" rx="7" fill="var(--ev-bg,#E4F1EF)" stroke="var(--ev,#0B6E63)" stroke-width="1.5"/>
