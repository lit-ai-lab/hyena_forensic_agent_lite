<text x="78" y="53" font-size="11.5" fill="#171C23">Lee Dong-geun–Kang Su-min chat</text>
<text x="78" y="65" font-size="9.5" fill="#6B7887">One year his senior · after the rooftop incident:</text>
<text x="78" y="76" font-size="9.5" fill="#6B7887">"This relieves my stress"</text>
