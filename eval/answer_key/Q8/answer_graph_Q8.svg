<text x="78" y="121" font-size="11.5" fill="#171C23">Parking lot errand</text>
<text x="78" y="136" font-size="9.5" fill="#6B7887">Called him down to move a car</text>
<rect x="34" y="170" width="280" height="48" rx="7" fill="var(--ev-bg,#E4F1EF)" stroke="var(--ev,#0B6E63)" stroke-width="1.5"/>
<text x="46" y="189" font-family="monospace" font-size="10" font-weight="600" fill="var(--ev,#0B6E63)">E3</text>
<text x="78" y="189" font-size="11.5" fill="#171C23">Go Su-bong–Kang Su-min chat</text>
<text x="78" y="201" font-size="9.5" fill="#6B7887">Cigarette and coffee errands · asked for a discount</text>
<text x="78" y="212" font-size="9.5" fill="#6B7887">at his family's sushi restaurant</text>
<rect x="34" y="238" width="280" height="48" rx="7" fill="var(--ev-bg,#E4F1EF)" stroke="var(--ev,#0B6E63)" stroke-width="1.5"/>
